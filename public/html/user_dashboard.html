<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/user_dashboard.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Dashboard</title>
</head>
<body>

    <!-- Header container -->
    <header class="header_dashboard">
        <div class="flv_div">
            <h1 class="header_text poppins-semibold">Agustin Mora</h1>
        </div>
        <div class="profile_header">
            <i class="bi bi-person-circle svg_profile"></i>
        </div>
    </header>

    <!-- Etiqueta del componente de busqueda -->
    <div class="label_carousel">
        <p class="label_carousel_search poppins-bold">Are you looking for a dish? ?</p>
    </div>

    <!-- Buscador (componente) -->
    <section class="input_section">
        <div class="search_container">
            <div class="icon_search">
                <i class="bi bi-search"></i>
            </div>
            <input type="search" name="" id="" placeholder="Search recipes" class="input_search">
        </div>
    </section>

    <!-- Contenedor de resultados -->
    <div id="search_results_container" class="search-modal hidden">
        <ul id="search_results_list" class="results-list"></ul>
    </div>

    <!-- Etiqueta del carrusel de recetas -->
    <div class="label_carousel">
        <p class="label_carousel_new poppins-bold">Explore new recipes</p>
    </div>

    <!-- Componente carrusel de imagenes -->
    <div class="flavorwell_carousel">
        <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="" class="d-block w-100 flv_img_carousel" alt="..." id="new_breakfast_img_recipe" data-table="breakfast">
                    <div class="carousel-caption">
                        <h1 class="recipe_name poppins-semibold" id="new_breakfast_name_recipe"></h1>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="" class="d-block w-100 flv_img_carousel" alt="..." id="new_dessert_img_recipe" data-table="desserts">
                    <div class="carousel-caption">
                        <h1 class="recipe_name poppins-semibold" id="new_dessert_name_recipe"></h1>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="" class="d-block w-100 flv_img_carousel" alt="..." id="new_strong_dish_img_recipe" data-table="strong_dish">
                    <div class="carousel-caption">
                        <h1 class="recipe_name poppins-semibold" id="new_strong_dish_name_recipe"></h1>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="" class="d-block w-100 flv_img_carousel" alt="..." id="new_vegan_img_recipe" data-table="vegan">
                    <div class="carousel-caption">
                        <h1 class="recipe_name poppins-semibold" id="new_vegan_name_recipe"></h1>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Etiqueta de botones para categorias -->
    <div class="label_carousel">
        <p class="label_carousel_search poppins-bold">Food categories</p>
    </div>

    <!-- Botones de listas de recetas por categoria -->
    <div class="category_buttons">
        <button class="cat_button btn_vegan">
            <img class="img_button_cat" src="/images/_img_recipe/vegan_cat.jpg" id="vegan_button">
            <span class="text_category poppins-medium">Vegan</span>
        </button>
        <button class="cat_button btn_desserts">
            <img class="img_button_cat" src="/images/_img_recipe/dessert_cat.jpg" id="desserts_button">
            <span class="text_category poppins-medium">Desserts</span>
        </button>
        <button class="cat_button btn_drinks">
            <img class="img_button_cat" src="/images/_img_recipe/strong_dish_cat.jpg" id="drinks_button">
            <span class="text_category poppins-medium">Dishes</span>
        </button>
        <button class="cat_button btn_breakfast">
            <img class="img_button_cat" src="/images/_img_recipe/breakfast_cat.jpg" id="breakfast_button">
            <span class="text_category poppins-medium">Breakfast</span>
        </button>
    </div>

    <!-- Etiqueta de recomendaciones -->
    <div class="label_carousel">
        <p class="label_carousel_search poppins-bold label_food_day">Recommended for you</p>
    </div>
    
    <!-- Componente de comida recomendada -->
    <section class="recommended_food">

        <div class="day_food day_breakfast">
            <img class="card_img_style" src="/images/_img_recipe/breakfast_cat.jpg" alt="" id="img_card_breakfast" data-table="breakfast">
            <div class="dish_name">
                <h2 class="recipe_day_name" id="recipe_breakfast_name"></h2>
            </div>
            <div class="icon_category day_breakfast">
                <i class="bi bi-cup-hot-fill category_icon"></i>
            </div>
        </div>

        <div class="day_food day_dessert">
            <img class="card_img_style" src="/images/_img_recipe/dessert_cat.jpg" alt="" id="img_card_dessert" data-table="desserts">
            <div class="dish_name">
                <h2 class="recipe_day_name" id="recipe_dessert_name"></h2>
            </div>
            <div class="icon_category day_dessert">
                <i class="bi bi-cake-fill category_icon"></i>
            </div>
        </div>

        <div class="day_food day_drink">
            <img class="card_img_style" src="/images/_img_recipe/drink_cat.jpg" alt="" id="img_card_strong_dish" data-table="strong_dish">
            <div class="dish_name">
                <h2 class="recipe_day_name" id="recipe_strong_dish_name"></h2>
            </div>
            <div class="icon_category day_drink">
                <i class="bi bi-fork-knife category_icon"></i>
            </div>
        </div>

        <div class="day_food day_vegan">
            <img class="card_img_style" src="/images/_img_recipe/vegan_cat.jpg" alt="" id="img_card_vegan" data-table="vegan">
            <div class="dish_name">
                <h2 class="recipe_day_name" id="recipe_vegan_name"></h2>
            </div>
            <div class="icon_category day_vegan">
                <i class="bi bi-leaf-fill category_icon"></i>
            </div>
        </div>

    </section>

    <span class="recipe-posts-label">Explore community dishes</span>

    <!-- Posteos de recetas recientes -->
    <section class="recipe_post_container">
    </section>

    <nav class="bottom_navbar">
        <div class="nav_icons" id="start">
            <i class="bi bi-house-door-fill"></i>
        </div>
        <div class="nav_icons" id="saved">
            <i class="bi bi-bookmark-fill"></i>
        </div>
        <div class="nav_icons" id="add">
            <i class="bi bi-plus-circle-fill"></i>
        </div>
        <div class="nav_icons" id="profile">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="nav_icons" id="settings">
            <i class="bi bi-gear-fill"></i>
        </div>
    </nav>

    <script src="/javascripts/user_dashboard_UI.js"></script>
    <!-- <script src="/javascripts/navbar_UI.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
