<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/signup.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Sign Up</title>
</head>
<body>

    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 class="header_text poppins-semibold" data-i18n="sign_up_header">Sign Up</h2>
        <div class="svg_icon">
            <i class="bi bi-person-fill-add"></i>
        </div>
    </header>
    
    <div class="container">

        <header class="header-signup">
            <h2 class="poppins-regular" data-i18n="su_welcome_to">Welcome to</h2>
            <h1>Flavorwell</h1>
        </header>

        <div class="img_container">
            <img class="logo_img" src="/images/_UI_img/logo_img.png" alt="img_UI">
        </div>

        <form class="form_container" id="register_user">
        
            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_mail" data-i18n="su_email">Email</label>
                <input name="username_mail" id="input_mail" class="inputs" type="email" placeholder="Enter your email address" data-i18n-placeholder="su_email_placeholder">
            </div>
        
            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_input" data-i18n="su_username">Username</label>
                <input name="username_input" id="input_username" class="inputs" type="text" placeholder="Enter your username" data-i18n-placeholder="su_username_placeholder">
            </div>
        
            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_password" data-i18n="su_password">Password</label>
                <div style="position: relative; width: 100%;">
                    <input name="username_password" id="input_password" class="inputs" type="password"
                        placeholder="Type a secure password" data-i18n-placeholder="su_password_placeholder">
                    <i class="bi bi-eye-slash toggle-password" id="togglePassword"
                        style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer; color: var(--Xhantous); font-size: 4vw;"></i>
                </div>
            </div>
        
            <p id="passwordWarning" class="password-warning poppins-regular"></p>
        
        
            <div class="div_buttons">
                <button id="signupButton" type="submit" class="reusable_button poppins-semibold" disabled data-i18n="su_sign_up">Sign Up</button>
            </div>
        
        </form>
    
    </div>
    
    <!-- Success modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p id="successfully-message"></p>
            <button id="backToLoginBtn" data-i18n="su_back_login">Back to login</button>
        </div>
    </div>

    <!-- Error modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <img id="img-context" src="" class="check_img" alt="check_img">
            <p id="text-context"></p>
            <button id="tryAgain" data-i18n="su_try_again">Try Again</button>
        </div>
    </div>
    
    <script src="/javascripts/translations.js"></script>
    <script type="module" src="/javascripts/signup_UI.js"></script>
</body> 
</html>
