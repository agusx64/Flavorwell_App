<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/signup.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Sign Up</title>
</head>
<body>
    
    <div class="container">

        <header>
            <h2 class="poppins-regular">Welcome to</h2>
            <h1>Flavorwell</h1>
        </header>

        <div class="img_container">
            <img class="logo_img" src="/images/_UI_img/logo_img.png" alt="img_UI">
        </div>

        <form class="form_container" id="register_user">

            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_mail">Email</label>
                <input name="username_mail" id="input_mail" class="inputs" type="email" placeholder="Enter your email address">
            </div>

            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_input">Username</label>
                <input name="username_input" id="input_username" class="inputs" type="text" placeholder="Enter your username">
            </div>

            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_password">Password</label>
                <input name="username_password" id="input_password" class="inputs" type="password" placeholder="Type a secure password">
            </div>
            
            <p id="passwordWarning" class="password-warning poppins-regular">
            </p>


            <div class="div_buttons">
                <button id="signupButton" type="submit" class="reusable_button poppins-semibold" disabled>Sign Up</button>
            </div>

        </form>
        
    </div>
        
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p>You have successfully registered</p>
            <button id="backToLoginBtn">Back to login</button>
        </div>
    </div>
        
    <script src="/javascripts/signup_UI.js"></script>
</body> 
</html>
