<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/forgot_password.css">

    <!-- Bootstrap icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Forgot password</title>
</head>
<body>
    
    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 class="header_text poppins-semibold">Recover account</h2>
        <div class="svg_icon">
            <i class="bi bi-person-fill-exclamation header_icon"></i>
        </div>
    </header>

    <section class="recover-password-container">
        <div class="form-recover-password">
            <h1 class="recover-title">Forgot Password ?</h1>
            <p class="recover-description">Enter your email or username to reset your password quickly</p>
            <img class="img-recover" src="/images/_img_recipe/coffe-recover.png">

            <!-- Componente reutilizable -->
            <div class="div_input input-component-recover-password">
                <label class="label_text poppins-semibold">Email or Username</label>
                <input id="input_recover_password" class="inputs" type="email" placeholder="Enter your email or username">
            </div>

            <button id="recover_password_button" type="submit" class="reusable_button poppins-semibold recover-button" disabled>Sign Up</button>

        </div>
    </section>

    <!-- Modal contextual de notificacion -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p>The recovery email has been sent successfully.</p>
            <button id="GoToResetPassword">Set new password</button>
        </div>
    </div>

</body>
</html>
