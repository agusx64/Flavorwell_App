<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/forgot_password.css">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Forgot password</title>
</head>
<body>
    
    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 class="header_text poppins-semibold" data-i18n="rc_recover_account">Recover account</h2>
        <div class="svg_icon">
            <i class="bi bi-person-fill-exclamation header_icon"></i>
        </div>
    </header>

    <section class="recover-password-container">
        <div class="form-recover-password">
            <h1 class="recover-title" data-i18n="rc_forgot_password">Forgot Password ?</h1>
            <p class="recover-description" data-i18n="rc_reset_quickly">Enter your email to reset your password quickly</p>
            <img class="img-recover" src="/images/_img_recipe/coffe-recover.png">

            <!-- Componente reutilizable -->
            <div class="div_input input-component-recover-password">
                <label class="label_text poppins-semibold" data-i18n="rc_email">Email</label>
                <input id="input_recover_password" class="inputs" type="email" placeholder="Enter your email" data-i18n-placeholder="rc_enter_your_email">
            </div>

            <button id="recover_password_button" type="submit" class="reusable_button poppins-semibold recover-button" disabled data-i18n="rc_send_mail">Send Email</button>

        </div>
    </section>

    <!-- Modal contextual de notificacion -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p data-i18n="rc_success">The recovery email has been sent successfully.</p>
            <button id="GoToResetPassword" data-i18n="rc_set_new">Set new password</button>
        </div>
    </div>

    <!-- Error modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <img id="img-context" src="" class="check_img" alt="check_img">
            <p id="text-context"></p>
            <button data-i18n="rc_try_again" id="tryAgain">Try Again</button>
        </div>
    </div>

    <script src="/javascripts/translations.js"></script>
    <script type="module" src="/javascripts/forgot_password.js"></script>
</body>
</html>
