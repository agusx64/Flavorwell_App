<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">


    <title>Log In</title>
</head>
<body>
    
    <div class="login_screen">

        <header>
            <h1 class="poppins-semibold">Welcome</h1>
            <p>Your favorite dishes at your <br>fingertips</p>
        </header>

        <img class="login_img" src="/images/_UI_img/login_img.png" alt="">

        <form class="form_container" id="form_login">

            <div class="div_input">
                <label class="label_text poppins-semibold">Email</label>
                <input id="username_email" class="inputs" type="email" placeholder="Enter your email address">
            </div>

            <div class="div_input">
                <label class="label_text poppins-semibold" for="username_password">Password</label>
                <input id="username_password" class="inputs" type="password" placeholder="Type a secure password">
            </div>

            <div class="div_buttons">
                <a class="a_signUp" href="/html/sign_up.html">Sign Up</a>
                <button id="loginButton" class="login_button poppins-semibold" disabled>Log In</button>
                <a class="a_forwotP" href="/html/forgot_password.html">Forgot Password?</a>
            </div>

        </form>
    </div>

    <!-- Error modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <img id="img-context" src="" class="check_img" alt="check_img">
            <p id="text-context"></p>
            <button id="tryAgain">Try Again</button>
        </div>
    </div>

    <script src="/javascripts/login_UI.js"></script>
</body>
</html>
