<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/settings.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Settings</title>
</head>
<body>

    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 data-i18n="set_title" class="header_text poppins-semibold">Settings</h2>
        <div class="svg_icon" id="svg-icon-profile">
            <i class="bi bi-gear-wide-connected"></i>
        </div>
    </header>

    <!-- Contendor de opciones de configuración -->
    <section class="user-settings-container">

        <!-- Contenedor de datos de usuario en sesion -->
        <div class="user-settings-info-container">
            <div class="user-settings-img-container">
                <i class="bi bi-person-circle user-settings-icon-header"></i>
            </div>
            <div class="user-settings-username-container">
                <h1 class="user-settings-username"></h1>
                <p class="user-settings-email"></p>
            </div>
        </div>

        <!-- Contenedor de linea de división -->
        <div class="user-settings-line-container">
            <div class="user-settings-line"></div>
        </div>

        <!-- Contenedor de opciones de configuracion -->
        <div class="user-settings-options-container">
            <div class="user-settings-option" id="about-button">
                <i class="bi bi-info-circle-fill user-settings-option-icon"></i>
                <span data-i18n="set_about" class="user-settings-option-text">About flavorwell</span>
            </div>
            <div class="user-settings-option" id="my-profile-button">
                <i class="bi bi-person-circle user-settings-option-icon"></i>
                <span data-i18n="set_profile" class="user-settings-option-text">My profile</span>
            </div>
            <div class="user-settings-option donate-button" id="donate-button">
                <i class="bi bi-paypal user-settings-option-icon paypal"></i>
                <span data-i18n="set_don" class="user-settings-option-text">Donate</span>
            </div>
            <div class="user-settings-option" id="log-out-button">
                <i class="bi bi-box-arrow-right user-settings-option-icon"></i>
                <span data-i18n="set_logout" class="user-settings-option-text">Log out</span>
            </div>
        </div>

    </section>

    <!-- Barra de navegación -->
    <nav class="bottom_navbar">
        <div class="nav_icons" id="start">
            <i class="bi bi-house-door-fill"></i>
        </div>
        <div class="nav_icons" id="saved">
            <i class="bi bi-bookmark-fill"></i>
        </div>
        <div class="nav_icons" id="add">
            <i class="bi bi-plus-circle-fill"></i>
        </div>
        <div class="nav_icons" id="profile">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="nav_icons" id="settings">
            <i class="bi bi-gear-fill"></i>
        </div>
    </nav>

    <!-- Success modal -->
    <div id="confirmationModal" class="modal hidden">
        <div class="modal-content modalLogOut">
            <img src="/images/_UI_img/error.webp" class="check_img" alt="error_img">
            <p data-i18n="set_shure">Are you sure you want to log out?</p>
            <div class="buttons-confirmation-container">
                <button data-i18n="av_yes" class="aprove" id="aprove-log-out">Yes</button>
                <button data-i18n="av_no" class="decline" id="decline-log-out">No</button>
            </div>
        </div>
    </div>
    
    <script src="/javascripts/settings_UI.js"></script>
    <script src="/javascripts/translations.js"></script>
    <script src="/javascripts/navbar_UI.js"></script>
</body>
</html>
