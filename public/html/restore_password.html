<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <link rel="stylesheet" href="/stylesheets/forgot_password.css">
    <link rel="stylesheet" href="/stylesheets/restore_password.css">

    <!-- Bootstrap icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Restore password</title>
</head>
<body>
    
    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 class="header_text poppins-semibold">Recover account</h2>
        <div class="svg_icon">
            <i class="bi bi-person-fill-lock"></i>
        </div>
    </header>

    <section class="recover-password-container">
        <div class="form-recover-password">
            <h1 class="recover-title">Password Reset</h1>
            <p class="recover-description">Please enter the security code and your new password to confirm the change.</p>
            
            <p class="label_text security-label poppins-semibold">Type your security code</p>
            <!-- Componente de codigo de seguridad -->
            <div class="security-code-container">
                <input id="input_code_1" class="input-code" type="text" inputmode="numeric" maxlength="1" data-index="0">
                <input id="input_code_2" class="input-code" type="text" inputmode="numeric" maxlength="1" data-index="1">
                <input id="input_code_3" class="input-code" type="text" inputmode="numeric" maxlength="1" data-index="2">
                <input id="input_code_4" class="input-code" type="text" inputmode="numeric" maxlength="1" data-index="3">
            </div>
            
            <!-- Componente reutilizable -->
            <div class="div_input input-component-recover-password">
                <label class="label_text poppins-semibold">Confirm your email</label>
                <input id="input_email" class="inputs" type="email" placeholder="Enter your email">
            </div>

            <!-- Componente reutilizable -->
            <div class="div_input input-component-recover-password">
                <label class="label_text poppins-semibold">Type your new password</label>
                <input id="input_password" class="inputs" type="email" placeholder="Enter your new password">
            </div>

            <!-- Mensajes de advertencia  -->
            <p id="passwordWarning" class="password-warning poppins-regular"></p>

            <button id="restore_password_button" type="submit" class="reusable_button poppins-semibold restore-button" disabled>Update password</button>

        </div>
    </section>

    <!-- Modal contextual de notificacion -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p>Your password has been successfully updated.</p>
            <button id="backToLogin">Back to login</button>
        </div>
    </div>

    <script src="/javascripts/restore_password.js"></script>
</body>
</html>
