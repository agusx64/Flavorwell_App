<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/choose_language.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Language settings</title>
</head>
<body>
    <section class="main-container">
        <div class="options-container">
            <span class="header-text-container">
                <img class="logo_samll_img" src="/images/_UI_img/logo_small.png" alt="Logo">
                <h1>Before we begin</h1>
                <p>Choose your language</p>
            </span>
            <div class="button-container-options">
                <button id="english-button">
                    English
                    <div class="check-icon-container english">
                        <i class="bi bi-check2"></i>
                    </div>
                </button>
                <button id="spanish-button">
                    Español
                    <div class="check-icon-container spanish">
                        <i class="bi bi-check2"></i>
                    </div>
                </button>
            </div>
        </div>
        <div class="options-container">
            <div class="description-text-container">
                <p>Your language preference can be changed at any time in Settings</p>
                <button class="choose-button-style" id="set-changes-button" disabled>Continue</button>
            </div>
        </div>
    </section>
    <script src="/javascripts/choose_language.js"></script>
</body>
</html>
