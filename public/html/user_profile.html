<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/stylesheets/user_profile.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>User profile</title>
</head>
<body>
    
    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 class="header_text poppins-semibold">My account</h2>
        <div class="svg_icon" id="svg-icon-profile">
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="user-profile-container">

        <!-- Contenedor de imagen de perfil -->
        <div class="user-profile-img-container">
            <div class="user-profile-img-frame">
                <img id="user-profile-img" src="" alt="No image loaded yet." class="user-profile-img">
            </div>
        </div>

        <!-- Contenedor de información de usuario -->
        <div class="user-profile-info-container">
            <h1 class="user-profile-name" id="user-profile-name"></h1>
            <p class="user-profile-email" id="user-profile-email"></p>
            <button class="user-profile-edit" id="user-profile-edit">
                Edit Profile
            </button>
        </div>

        <!-- Contenedor de botones -->
        <div class="user-profile-menu">
            <p class="user-profile-button-label">My footprint at flavorwell</p>
            <button class="user-profile-button" id="user-profile-saved-recipes">
                <i class="bi bi-bookmark-fill user-profile-icon-button"></i>
                <h2>Saved Recipes</h2>
            </button>
            <button class="user-profile-button" id="user-profile-my-recipes">
                <i class="bi bi-arrow-up-circle-fill user-profile-icon-button"></i>
                <h2>My recipes</h2>
            </button>
            <p class="user-profile-button-label">Preferences</p>
            <button class="user-profile-button" id="user-profile-me">
                <i class="bi bi-person-circle user-profile-icon-button"></i>
                <h2>My profile</h2>
            </button>
            <button class="user-profile-button log-out" id="user-profile-log-out">
                <i class="bi bi-door-open-fill user-profile-icon-button"></i>
                <h2>Log Out</h2>
            </button>
        </div>

    </div>

    <!-- Barra de navegación -->
    <nav class="bottom_navbar">
        <div class="nav_icons" id="start">
            <i class="bi bi-house-door-fill"></i>
        </div>
        <div class="nav_icons" id="saved">
            <i class="bi bi-bookmark-fill"></i>
        </div>
        <div class="nav_icons" id="add">
            <i class="bi bi-plus-circle-fill"></i>
        </div>
        <div class="nav_icons" id="profile">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="nav_icons" id="settings">
            <i class="bi bi-gear-fill"></i>
        </div>
    </nav>

    <!-- Success modal -->
    <div id="confirmationModal" class="modal hidden">
        <div class="modal-content modalLogOut">
            <img src="/images/_UI_img/error.webp" class="check_img" alt="error_img">
            <p>Are you sure you want to log out?</p>
            <div class="buttons-confirmation-container">
                <button class="aprove" id="aprove">Yes</button>
                <button class="decline" id="decline">No</button>
            </div>
        </div>
    </div>

    <!-- Modal para editar perfil de usuario -->
    <div id="edit-profile-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-edit-title">Edit profile</h2>
        
            <label>Username</label>
            <input class="input-edit-modal" type="text" id="edit-username" />
        
            <label>Email</label>
            <input class="input-edit-modal" type="email" id="edit-email" />
        
            <label>Profile picture</label>
            <label for="edit-profile-img" class="custom-file-upload">
                <i class="bi bi-upload"></i>
            </label>
            <input class="user-input-image" type="file" id="edit-profile-img" accept="image/*" />

            <label>Cover picture</label>
            <label for="edit-cover-img" class="custom-file-upload cover-upload">
                <i class="bi bi-upload"></i>
            </label>
            <input class="user-input-image" type="file" id="edit-cover-img" accept="image/*" />
        
            <div class="user-profile-button-modal-container">
                <button id="save-profile-changes" class="user-profile-modal-button disabled" disabled>Save changes</button>
                <button id="cancel-edit" class="user-profile-modal-button cancel">Cancel</button>
            </div>
            <div class="message-validation-container">
            </div>
        </div>
    </div>


    <script src="/javascripts/user_profile_UI.js"></script>
    <script src="/javascripts/navbar_UI.js"></script>
</body>
</html>
