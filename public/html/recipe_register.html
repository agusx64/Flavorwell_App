<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/stylesheets/recipe_register.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    
    <title>Up & Share</title>
</head>
<body>
    
    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 data-i18n="rg_header" class="header_text poppins-semibold">Recipe publisher</h2>
        <div class="svg_icon">
            <i class="bi bi-cloud-arrow-up-fill"></i>
        </div>
    </header>

    <!-- Componente de formulario -->
    <div class="screen_recipe_register">
        <!-- Contenedor de titulo de sección -->
        <section class="title_text_container">
            <h1 data-i18n="rg_title" class="title poppins-semibold">Up & Share</h1>
            <h3 data-i18n="rg_description" class="desc_text poppins-medium">Share your own recipes with the community of flavorwell</h3>
        </section>

        <!-- Componentes de formulario -->
        <section class="form_post_recipe_register">

            <!-- Contenedor de selector de ingredientes -->
            <div class="select-wrapper-container">
                <label data-i18n="rg_choose" for="category_dish" class="label_text_form poppins-semibold">Choose a category for your recipe</label>
            
                <div class="custom-select-wrapper">
                    <div class="custom-select">
                        <div class="custom-select-trigger">
                            <span data-i18n="rg_select" class="poppins-semibold text_trigger">Select a category</span>
                            <div class="arrow"></div>
                        </div>
                        <div class="custom-options">
                            <span class="custom-option" data-value="breakfast">
                                <i class="bi bi-cup-hot-fill option_icon breakfast"></i>
                                <span data-i18n="rg_option1">Breakfast</span>
                            </span>

                            <span class="custom-option" data-value="desserts">
                                <i class="bi bi-cake-fill option_icon dessert"></i>
                                <span data-i18n="rg_option2">Desserts</span>
                            </span>

                            <span class="custom-option" data-value="strong_dish">
                                <i class="bi bi-fork-knife option_icon dish"></i>
                                <span data-i18n="rg_option3">Strong Dish</span>
                            </span>

                            <span class="custom-option" data-value="vegan">
                                <i class="bi bi-leaf-fill option_icon vegan"></i>
                                <span data-i18n="rg_option4">Vegan</span>
                            </span>
                        </div>
                    </div>
                </div>
                <select name="category_dish" id="real-select" style="display:none;">
                    <option value="Breakfast"></option>
                    <option value="Desserts"></option>
                    <option value="Dish"></option>
                    <option value="Vegan"></option>
                </select>
            </div>

            <!-- Contenedor de input para nombre de receta -->
            <div class="name-recipe-input-container">
                <label data-i18n="rg_name" for="name_recipe" class="label_text_form poppins-semibold">Type the name of the recipe</label>
                <input data-i18n-placeholder="rg_example" id="name-recipe-text" name="name_recipe" type="text" class="input_text" placeholder="Example: Chesse fingers">
            </div>
            
            <!-- Contenedor de input para descripción de recetas -->
            <div class="description-recipe-input-container">
                <button id="generate-description-button" class="generate-description-button" disabled>
                    <i class="bi bi-stars"></i>
                </button>
                <label data-i18n="rg_description_r" for="recipe_description" class="label_text_form poppins-semibold">Recipe description</label>
                <textarea data-i18n-placeholder="rg_type_d" name="recipe_description" maxlength="400" id="recipe-description-text" cols="30" rows="10" class="input_text description_recipe" placeholder="Type a description (max. 150 words)"></textarea>
            </div>

            <!-- Buscador de ingredientes -->
            <div class="ingredient-section">
                <label data-i18n="rg_find" for="ingredient-search" class="label_text_form poppins-semibold">Find your ingredients </label>
                <div class="search-box">
                    <input data-i18n-placeholder="rg_search" class="input_text" type="text" id="ingredient-search" placeholder="Search ingredients...">
                    <ul id="ingredient-results" class="results-list hidden"></ul>
                </div>
                <ul id="selected-ingredients" class="selected-ingredients-list"></ul>
            </div>

            <!-- Componente para agregar pasos a la receta -->
            <section class="steps-section">
                <label data-i18n="rg_add" for="step_input" class="steps-label label_text_form poppins-semibold">Add steps to your recipe</label>
            
                <div class="step-search-bar">
                    <input data-i18n-placeholder="rg_describe_i" type="text" id="step_input" class="step-input input_text" placeholder="Describe the next step...">
                    <button class="add-step-btn" id="add_step_btn">
                        <i class="bi bi-plus"></i>
                    </button>
                </div>
            
                <ul id="step_list" class="step-list"></ul>
            </section> 

            <!-- Input para subir imagen de receta -->
            <div class="recipe-register-img-input-container">
                <label data-i18n="rg_upload" class="label_text_form poppins-semibold">Upload your recipe image</label>
                <label id="label-recipe-register-img" for="formFile" class="file-input-label-style poppins-semibold">
                    <i class="bi bi-upload"></i>
                </label>
                <input name="image" accept=".jpg, .jpeg, .png .webp" class="form-control form_control_file" type="file" id="formFile" disabled>
            </div>

            <!-- Boton de envio de datos -->
            <button data-i18n="rg_share_now" class="post_button_recipe poppins-semibold" id="send-recipe" disabled>Share your dish now</button>

        </section>
    </div>

    <!-- Barra de navegación -->
    <nav class="bottom_navbar">
        <div class="nav_icons" id="start">
            <i class="bi bi-house-door-fill"></i>
        </div>
        <div class="nav_icons" id="saved">
            <i class="bi bi-bookmark-fill"></i>
        </div>
        <div class="nav_icons" id="add">
            <i class="bi bi-plus-circle-fill"></i>
        </div>
        <div class="nav_icons" id="profile">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="nav_icons" id="settings">
            <i class="bi bi-gear-fill"></i>
        </div>
    </nav>

    <!-- Success modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <img src="/images/_UI_img/check.webp" class="check_img" alt="check_img">
            <p>Thanks for sharing your recipe. We'll review it for publication.</p>
            <button id="backToMenu">Go to dashboard</button>
        </div>
    </div>

    <!-- Error modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <img id="img-context" src="" class="check_img" alt="check_img">
            <p id="text-context"></p>
            <button id="tryAgain">Try Again</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="/javascripts/recipe_register_UI.js"></script>
    <script src="/javascripts/translations.js"></script>
    <script src="/javascripts/navbar_UI.js"></script>
</body>
</html>
