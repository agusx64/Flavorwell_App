<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="/stylesheets/recipe_viewer.css">
    <link rel="stylesheet" href="/stylesheets/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Recipe Viewer</title>
</head>
<body>

    <!-- Template for another UI -->
    <header class="header_menu" onclick="history.back()">
        <button class="svg_icon return">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
        <h2 data-i18n="rv_title" class="header_text poppins-semibold">Recipe viewer</h2>
        <div class="svg_icon">
            <i class="bi bi-cookie"></i>
        </div>
    </header>

    <!-- Contendor de datos de la receta -->
    <div class="recipe-viewer-container">

        <!-- Contenedor de titulo de receta y autor -->
        <div class="recipe-viewer-title-container">
            <h1 class="recipe-viewer-title" id="recipe-viewer-title"></h1>
            <span class="recipe-viewer-author">
                <strong data-i18n="rv_by" class="recipe-viewer-prefix">By: </strong>
                <p id="recipe-viewer-author" class="recipe-viewer-author"></p>
            </span>
        </div>

        <!-- Contenedor de imagen de receta -->
        <div class="recipe-viewer-image-container">
            <img class="recipe-viewer-image" id="recipe-viewer-image" src="/images/_UI_img/default.jpg" alt="">
        </div>

        <!-- Contenedor de contador de likes y guardados de la receta -->
        <div class="recipe-viewer-status-container">
            <div class="recipe-viewer-status status-left" id="recipe-viewer-status-img">
                <img src="" alt="image_of_author" class="recipe-viewer-status-img">
                <p class="recipe-viewer-status-author" id="recipe-viewer-status-author"></p>
            </div>
            <div class="recipe-viewer-status status-right">
                <button class="recipe-viewer-status-counter-container">
                    <i class="bi bi-hand-thumbs-up-fill counter-icon"></i>
                    <p class="recipe-viewer-status-counter" id="recipe-viewer-status-counter-like">--</p>
                </button>
                <button class="recipe-viewer-status-counter-container">
                    <i class="bi bi-bookmark-fill counter-icon"></i>
                    <p class="recipe-viewer-status-counter" id="recipe-viewer-status-counter-saved">--</p>
                </button>
            </div>
        </div>

        <!-- Contenedor de descripcion de receta -->
        <div class="recipe-viewer-description-container">
            <h3 data-i18n="rv_description" class="recipe-viewer-description-title">Description</h3>
            <p id="recipe-viewer-description" class="recipe-viewer-description"></p>
        </div>

        <!-- Contenedor de detalles extra de receta -->
        <div class="recipe-viewer-recipe-data-container">
            <div class="recipe-viewer-recipe-data">
                <i class="bi bi-calendar4-week recipe-viewer-icon"></i>
                <span class="recipe-viewer-details">
                    <strong data-i18n="rv_date">Date:</strong>
                    <p id="recipe-viewer-details-date"></p>
                </span>
            </div>
            <div class="recipe-viewer-recipe-data">
                <i class="bi bi-tags-fill recipe-viewer-icon"></i>
                <span class="recipe-viewer-details">
                    <strong data-i18n="rv_category">Category:</strong>
                    <p id="recipe-viewer-details-category"></p>
                </span>
            </div>
            <div class="recipe-viewer-recipe-data">
                <i class="bi bi-box-fill recipe-viewer-icon"></i>
                <span class="recipe-viewer-details">
                    <strong data-i18n="rv_items">Items:</strong>
                    <p id="recipe-viewer-details-items"></p>
                </span>
            </div>
        </div>

        <!-- Contenedor de titulo de ingredientes -->
        <div class="recipe-viewer-ingredients-title-container">
            <h3 data-i18n="rv_ingr" class="recipe-viewer-ingredients-title">Ingredients</h3>
        </div>

        <!-- Componente contenedor de lista de ingredientes -->
        <div class="recipe-viewer-ingredients-list-container">

            <div class="recipe-viewer-ingredients-item">
            </div>

        </div>

        <!-- Contenedor de titulo de ingredientes -->
        <div class="recipe-viewer-instructions-title-container">
            <h3 data-i18n="rv_ins" class="recipe-viewer-instructions-title">Instructions</h3>
        </div>

        <!-- Componente dinamico de instrucciones -->
        <div class="recipe-viewer-instructions-container">
            <ul>
            </ul>
        </div>

        <button id="toggle-comments-btn" class="btn_secondary">
            Show comments
        </button>

        <!-- Contenedor de comentarios -->
        <div id="comments-section" class="comments hidden">
            <div id="comments-list"></div>
        </div>

        <!-- Entrada de comentarios -->
        <div class="add-comment">
            <textarea id="comment-input" placeholder="Write a comment..." maxlength="300"></textarea>
            <button id="send-comment-btn" class="btn_primary">
                Add comment
            </button>
        </div>


        <!-- Componente de derechos de autor sobre la receta -->
        <div class="recipe-viewer-copyright-container">
            <p class="recipe-viewer-copyright-text" id="recipe-viewer-copyright-text"></p>
        </div>

    </div>

    <!-- Barra de navegación -->
    <nav class="bottom_navbar">
        <div class="nav_icons" id="start">
            <i class="bi bi-house-door-fill"></i>
        </div>
        <div class="nav_icons" id="saved">
            <i class="bi bi-bookmark-fill"></i>
        </div>
        <div class="nav_icons" id="add">
            <i class="bi bi-plus-circle-fill"></i>
        </div>
        <div class="nav_icons" id="profile">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="nav_icons" id="settings">
            <i class="bi bi-gear-fill"></i>
        </div>
    </nav>

    <script type="module" src="/javascripts/recipe_viewer_UI.js"></script>
    <script src="/javascripts/translations.js"></script>
    <script src="/javascripts/navbar_UI.js"></script>
</body>
</html>
